name: Build ESP32-S3 Firmware

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          # docker hub 无 master / v6.1.0 tag；release-v6.1 为官方最新 release 分支镜像
          # 新版（如 v6.2）发布后，改为此处 tag 并同步更新 README §2
          esp_idf_version: release-v6.1
          target: esp32s3
          path: '.'
          command: set -o pipefail && idf.py build 2>&1 | tee build.log

      # 调试辅助：失败时将构建日志提交回仓库（修复后移除）
      - name: Publish build log on failure
        if: failure()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f build.log
          git commit -m "ci: 构建失败日志（临时调试，可忽略）" || true
          git push origin HEAD || true

      - name: Merge firmware image
        run: |
          ls -la build/*.bin
          pip install esptool -q
          python -m esptool --chip esp32s3 merge_bin \
            -o merged_esp32s3_gps.bin \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/esp32s3_gps_codex.bin

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: |
            merged_esp32s3_gps.bin
            build/*.bin
            build/*.elf
